<h1>
<code>chunklist</code> Function</h1> <p><code>chunklist</code> splits a single list into fixed-size chunks, returning a list of lists.</p> <div class="language-hcl codeBlockContainer_APcc theme-code-block" style="--prism-background-color:hsl(220, 13%, 18%);--prism-color:hsl(220, 14%, 71%)"><div class="codeBlockContent_m3Ux"><figure><figcaption class="sr-only">Code Block</figcaption><pre tabindex="0" role="code" aria-label="Code Block" data-language="hcl">chunklist(list, chunk_size)</pre></figure></div></div> <h2 class="anchor anchorWithHideOnScrollNavbar_WYt5" id="examples">Examples<a href="#examples" class="hash-link" aria-label="Direct link to Examples" title="Direct link to Examples">​</a>
