<h1 id="summary"><span>bool</span></h1>
<p>A type with two states.</p>
<p>The boolean type has two values: <code><span>true</span></code> and <code><span>false</span></code>. It denotes whether something is active or enabled.</p>
<h2 id="example">Example</h2>
<div>
<pre data-language="typst">#false \
#true \
#(1 &lt; 2)
</pre>
