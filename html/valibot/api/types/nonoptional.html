<h1 id="nonoptional">NonOptional</h1>

<p>Extracts <code>undefined</code> from a type.</p>

<h2 id="generics">Generics</h2>

<ul>
<li><code>TValue</code> <code>extends any</code></li>
</ul>

<h2 id="definition">Definition</h2>

<ul>
<li><code>NonOptional</code> <code>TValue extends undefined ? never : TValue</code></li>
</ul>
