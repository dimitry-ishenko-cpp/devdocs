<h1 id="nonnullish">NonNullish</h1>

<p>Extracts <code>null</code> and <code>undefined</code> from a type.</p>

<h2 id="generics">Generics</h2>

<ul>
<li><code>TValue</code> <code>extends any</code></li>
</ul>

<h2 id="definition">Definition</h2>

<ul>
<li><code>NonNullish</code> <code>TValue extends null | undefined ? never : TValue</code></li>
</ul>
