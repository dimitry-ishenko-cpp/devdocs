<h1 id="nonnullable">NonNullable</h1>

<p>Extracts <code>null</code> from a type.</p>

<h2 id="generics">Generics</h2>

<ul>
<li><code>TValue</code> <code>extends any</code></li>
</ul>

<h2 id="definition">Definition</h2>

<ul>
<li><code>NonNullable</code> <code>TValue extends null ? never : TValue</code></li>
</ul>
